{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "plaxion-platform.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "plaxion-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "plaxion-platform.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- if .Values.networkPolicy.allowExternal }}
    - from: []
      ports:
        - protocol: TCP
          port: {{ .Values.api.service.targetPort | default 8080 }}
        - protocol: TCP
          port: {{ .Values.ingestion.service.targetPort | default 8080 }}
    {{- else }}
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.api.service.targetPort | default 8080 }}
        - protocol: TCP
          port: {{ .Values.ingestion.service.targetPort | default 8080 }}
    {{- end }}
    {{- with .Values.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # PostgreSQL
    - ports:
        - protocol: TCP
          port: {{ include "plaxion-platform.databasePort" . | int }}
      {{- if eq .Values.database.mode "bundled" }}
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
              app.kubernetes.io/instance: {{ .Release.Name }}
      {{- end }}
    {{- if not .Values.networkPolicy.restrictiveEgress }}
    # Allow all other egress when not restrictive (default)
    - {}
    {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
