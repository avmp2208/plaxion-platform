{{- if and .Values.ingestion.enabled .Values.ingestion.ingress.enabled }}
{{- /*
  NOTE: Prefer enabling either ingestion.ingress OR ingestion.ingressRoute for the same host,
  not both. External exposure of ingestion is opt-in; default is ClusterIP only.
*/}}
{{- $fullName := printf "%s-ingestion" (include "plaxion-platform.fullname" .) }}
{{- $svcPort := .Values.ingestion.service.port }}
{{- $className := .Values.ingestion.ingress.className | default .Values.ingress.className }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "plaxion-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingestion
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.ingestion.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if $className }}
  ingressClassName: {{ $className }}
  {{- end }}
  {{- if .Values.ingestion.ingress.tls }}
  tls:
    {{- range .Values.ingestion.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingestion.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $svcPort }}
          {{- end }}
    {{- end }}
{{- end }}
