{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "plaxion-platform.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "plaxion-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.api.revisionHistoryLimit | default 3 }}
  selector:
    matchLabels:
      {{- include "plaxion-platform.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "plaxion-platform.api.selectorLabels" . | nindent 8 }}
        {{- with .Values.api.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "plaxion-platform.serviceAccountName" . }}
      {{- include "plaxion-platform.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- include "plaxion-platform.nodeSelector" (dict "root" . "component" .Values.api) | nindent 6 }}
      {{- include "plaxion-platform.tolerations" (dict "root" . "component" .Values.api) | nindent 6 }}
      {{- include "plaxion-platform.affinity" (dict "root" . "component" .Values.api) | nindent 6 }}
      {{- include "plaxion-platform.topologySpreadConstraints" (dict "root" . "component" .Values.api) | nindent 6 }}
      containers:
        - name: api
          image: {{ include "plaxion-platform.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.api.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.api.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.targetPort | default 8080 }}
              protocol: TCP
          env:
            {{- include "plaxion-platform.apiEnv" . | nindent 12 }}
            {{- include "plaxion-platform.commonEnv" . | nindent 12 }}
            {{- with .Values.extraEnv }}
            {{- include "plaxion-platform.extraEnv" . | nindent 12 }}
            {{- end }}
            {{- with .Values.api.extraEnv }}
            {{- include "plaxion-platform.extraEnv" . | nindent 12 }}
            {{- end }}
          {{- if or .Values.extraEnvFrom .Values.api.extraEnvFrom }}
          envFrom:
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.api.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if .Values.api.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.api.livenessProbe.path | default "/health" }}
              port: http
            initialDelaySeconds: {{ .Values.api.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.api.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.api.livenessProbe.failureThreshold }}
            successThreshold: {{ .Values.api.livenessProbe.successThreshold }}
          {{- end }}
          {{- if .Values.api.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.api.readinessProbe.path | default "/health/ready" }}
              port: http
            initialDelaySeconds: {{ .Values.api.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.api.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.api.readinessProbe.failureThreshold }}
            successThreshold: {{ .Values.api.readinessProbe.successThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
{{- end }}
