{{- include "plaxion-platform.validate" . }}
{{- if (include "plaxion-platform.createSecret" .) }}
{{- $secretName := include "plaxion-platform.secretName" . }}
{{- $hasExistingCS := and .Values.database.external.existingConnectionStringSecret .Values.database.external.existingConnectionStringSecret.name }}
{{- /* Preserve existing chart secret data across upgrades when values do not force rotation */ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $password := "" }}
{{- $connectionString := "" }}
{{- $otlpHeaders := .Values.secrets.observability.otlpHeaders | default .Values.config.observability.otlpHeaders | default "" }}
{{- if and $existing $existing.data }}
  {{- if index $existing.data "password" }}
    {{- $password = index $existing.data "password" | b64dec }}
  {{- end }}
  {{- if index $existing.data "connection-string" }}
    {{- $connectionString = index $existing.data "connection-string" | b64dec }}
  {{- end }}
  {{- if and (not $otlpHeaders) (index $existing.data "otlp-headers") }}
    {{- $otlpHeaders = index $existing.data "otlp-headers" | b64dec }}
  {{- end }}
{{- end }}
{{- if not $hasExistingCS }}
  {{- /* Rebuild connection string from current values + resolved password */ -}}
  {{- $password = include "plaxion-platform.databasePassword" . }}
  {{- $host := include "plaxion-platform.databaseHost" . }}
  {{- $port := include "plaxion-platform.databasePort" . }}
  {{- $db := include "plaxion-platform.databaseName" . }}
  {{- $user := include "plaxion-platform.databaseUsername" . }}
  {{- $connectionString = printf "Host=%s;Port=%s;Database=%s;Username=%s;Password=%s" $host $port $db $user $password }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "plaxion-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
  annotations:
    {{- /*
      Created as a pre-install/pre-upgrade hook (weight -10) so it exists before the
      migration Job hook (weight -5). delete-policy is before-hook-creation only so
      the Secret is NOT removed after the hook succeeds (Deployments still need it).
    */}}
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
    {{- with .Values.secrets.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
stringData:
  {{- if not $hasExistingCS }}
  password: {{ $password | quote }}
  connection-string: {{ $connectionString | quote }}
  {{- end }}
  {{- if and $otlpHeaders (not (and .Values.secrets.observability.existingSecret .Values.secrets.observability.existingSecret.name)) }}
  otlp-headers: {{ $otlpHeaders | quote }}
  {{- end }}
{{- end }}
